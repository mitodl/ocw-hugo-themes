{{ $youtubeID := trim (.context.Params.video_metadata.youtube_id | default "") " " }}
{{ if and $youtubeID (not (partial "local_video_file.html" .downloadLink)) }}
  {{ $startTime := trim (.context.Params.start_time | default "" | string) " " }}
  <div class="my-3">
    <a
      class="video-youtube-link btn btn-sm btn-outline-secondary d-inline-flex align-items-center px-3 py-2 text-decoration-none"
      href="https://www.youtube.com/watch?v={{ $youtubeID }}{{ if findRE `^[0-9]+$` $startTime }}&amp;t={{ $startTime }}s{{ end }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Watch on YouTube (opens in a new tab)"
    >
      <span>Watch on YouTube</span>
      <i class="material-icons md-18 ml-2" aria-hidden="true">arrow_forward</i>
    </a>
  </div>
{{ end }}
