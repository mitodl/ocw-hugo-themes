baseURL: /ocw-transition/
languageCode: en
module:
  imports:
    - path: ocw-transition
    - path: base-theme
      mounts:
        - source: layouts
          target: layouts
        - source: data
          target: data
disableKinds:
  - taxonomy
  - term
  - RSS
  - sitemap
  - robotsTXT
params:
  description: Find the same free courses and course materials on MIT Learn, alongside MITx courses and other learning resources from across MIT.
  learnBaseURL: https://learn.mit.edu
security:
  funcs:
    getenv:
      - ^HUGO_
      - ^MIT_LEARN_BASE_URL$
      - ^NOINDEX$
