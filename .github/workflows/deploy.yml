name: Deploy PR build and run Lighthouse
on:
  pull_request:
  push:
    branches:
      - main
env:
  # TEMPORARY: switched from 15-s21-nuts-and-bolts-of-business-plans-january-iap-2014
  # to a course that actually has image galleries. Revert before merge.
  COURSE_V3_URL_SLUG: 3-a04-modern-blacksmithing-and-physical-metallurgy-fall-2008

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      deployments: write
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.1
          cache: "yarn"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.142.0"
          extended: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Clone ocw-www for content
        run: (cd ..; git clone git@github.mit.edu:ocw-content-rc/ocw-www.git ocw-www)

      - name: Clone ocw-course for content
        # TEMPORARY: switched from 15.s21-january-iap-2014 to a course with image
        # galleries. Revert before merge.
        run: (cd ..; git clone git@github.mit.edu:ocw-content-rc/3.a04-fall-2008.git ocw-course)

      - name: Clone ocw-hugo-projects for config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "mitodl/ocw-hugo-projects"
          ref: "main"
          path: "ocw-hugo-projects"
          persist-credentials: false

      - name: Run webpack build
        run: npm run build:webpack -- --output-path=../ocw-www/public/static_shared/
        env:
          FEATURE_ENABLE_LEARN_INTEGRATION: "true"
          LEARN_AI_SYLLABUS_ENDPOINT: ${{ secrets.LEARN_AI_SYLLABUS_ENDPOINT }}
          MIT_LEARN_BASE_URL: ${{ secrets.MIT_LEARN_BASE_URL }}
          MIT_LEARN_API_BASE_URL: ${{ secrets.MIT_LEARN_API_BASE_URL }}

      - name: Copy webpack build to course v2
        run: mkdir -p ../ocw-course/public-v2/ && cp -r ../ocw-www/public/static_shared/ ../ocw-course/public-v2/

      - name: Copy webpack build to course v3
        run: mkdir -p ../ocw-course/public-v3/ && cp -r ../ocw-www/public/static_shared/ ../ocw-course/public-v3/

      - name: Run the www hugo build
        run: (cd ../ocw-www; hugo --config $GITHUB_WORKSPACE/ocw-hugo-projects/ocw-www/config.yaml --themesDir ../ocw-hugo-themes)
        env:
          OCW_STUDIO_BASE_URL: ${{ secrets.OCW_STUDIO_BASE_URL }}
          SEARCH_API_URL: ${{ secrets.SEARCH_API_URL }}
          OCW_COURSE_STARTER_SLUG: ${{ secrets.OCW_COURSE_STARTER_SLUG }}
          STATIC_API_BASE_URL: ${{ secrets.STATIC_API_BASE_URL }}
          RESOURCE_BASE_URL: ${{ secrets.RESOURCE_BASE_URL }}

      - name: Run the course v2 hugo build
        run: (cd ../ocw-course; hugo --config $GITHUB_WORKSPACE/ocw-hugo-projects/ocw-course-v2/config.yaml  --destination public-v2 --themesDir ../ocw-hugo-themes)
        env:
          OCW_STUDIO_BASE_URL: ${{ secrets.OCW_STUDIO_BASE_URL }}
          SEARCH_API_URL: ${{ secrets.SEARCH_API_URL }}
          OCW_COURSE_STARTER_SLUG: ${{ secrets.OCW_COURSE_STARTER_SLUG }}
          STATIC_API_BASE_URL: ${{ secrets.STATIC_API_BASE_URL }}
          RESOURCE_BASE_URL: ${{ secrets.RESOURCE_BASE_URL }}

      - name: Run the course v3 hugo build
        run: (cd ../ocw-course; hugo --config $GITHUB_WORKSPACE/ocw-hugo-projects/ocw-course-v3/config.yaml --destination public-v3/courses/o/${{ env.COURSE_V3_URL_SLUG }}/ --baseURL /courses/o/${{ env.COURSE_V3_URL_SLUG }}/ --themesDir ../ocw-hugo-themes)
        env:
          OCW_STUDIO_BASE_URL: ${{ secrets.OCW_STUDIO_BASE_URL }}
          SEARCH_API_URL: ${{ secrets.SEARCH_API_URL }}
          OCW_COURSE_STARTER_SLUG: ${{ secrets.OCW_COURSE_STARTER_SLUG }}
          STATIC_API_BASE_URL: ${{ secrets.STATIC_API_BASE_URL }}
          RESOURCE_BASE_URL: ${{ secrets.RESOURCE_BASE_URL_V3 }}

      - name: Deploy www Preview to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          publish-dir: "../ocw-www/public"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          alias: ocw-hugo-themes-www-pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy v2 Course Preview to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          publish-dir: "../ocw-course/public-v2"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          alias: ocw-hugo-themes-course-v2-pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy v3 Course Preview to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          publish-dir: "../ocw-course/public-v3"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          alias: ocw-hugo-themes-course-v3-pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Set comment body
        id: set-comment-body
        run: |
          body=$(echo 'Netlify Deployments:<br>www: https://ocw-hugo-themes-www-pr-${{ github.event.number }}--ocw-next.netlify.app/ <br> Course v2: https://ocw-hugo-themes-course-v2-pr-${{ github.event.number }}--ocw-next.netlify.app/ <br> Course v3: https://ocw-hugo-themes-course-v3-pr-${{ github.event.number }}--ocw-next.netlify.app/courses/o/${{ env.COURSE_V3_URL_SLUG }}/')
          echo "body=$body" >> $GITHUB_OUTPUT
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: fc
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Netlify Deployments"

      - name: Create comment
        if: ${{ steps.fc.outputs.comment-id == 0 }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.set-comment-body.outputs.body }}

      - name: Update comment
        if: ${{ steps.fc.outputs.comment-id != 0 }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        continue-on-error: true
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.set-comment-body.outputs.body }}

      - name: Deploy CI build to Netlify
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        if: ${{ github.event_name == 'push' }}
        with:
          publish-dir: "../ocw-www/public"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.1
          cache: "yarn"

      - run: mkdir -p ${{ github.workspace }}/tmp/artifacts

      - name: Run Lighthouse
        uses: foo-software/lighthouse-check-action@a0b9f2d21433a2fb807adf9f83fbd3b4bec0a9d7 # master, resolved 2026-08-05 (no tagged release newer than v12.0.1)
        with:
          branch: ${{ github.ref }}
          outputDirectory: ${{ github.workspace }}/tmp/artifacts
          urls: "https://ocw-hugo-themes-www-pr-${{ github.event.number }}--ocw-next.netlify.app/,https://ocw-hugo-themes-www-pr-${{ github.event.number }}--ocw-next.netlify.app/search/,https://ocw-hugo-themes-course-v2-pr-${{ github.event.number }}--ocw-next.netlify.app/,https://ocw-hugo-themes-course-v3-pr-${{ github.event.number }}--ocw-next.netlify.app/courses/o/${{ env.COURSE_V3_URL_SLUG }}/"
          sha: ${{ github.sha }}
          accessToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lighthouse reports
          path: ${{ github.workspace }}/tmp/artifacts
